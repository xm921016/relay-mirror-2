<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>号池管理 · 定制版（dingzhi）</title>
<style>
body{font-family:-apple-system,system-ui,"PingFang SC",sans-serif;background:#f5f6f8;margin:0;padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:16px}
.head{text-align:center}.page-title{font-size:20px;font-weight:600;color:#1e5fa8;margin:0}
.page-sub{font-size:13px;color:#666;margin:6px 0 0}
.abox{background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);width:100%;max-width:1400px;box-sizing:border-box}
label{display:block;font-size:13px;margin:12px 0 4px;color:#333}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:#1e5fa8;color:#fff;font-size:15px;cursor:pointer}
button.mini{margin-top:0;width:auto;padding:4px 8px;font-size:12px}
button.gray{background:#888}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:13px;min-height:18px}
.ok{color:#1e5fa8}.err{color:#a32d2d}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.stat{flex:1;min-width:100px;background:#eaf2fb;border-radius:10px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:20px;color:#1e5fa8}
.stat span{font-size:12px;color:#666}
.stat.warn{background:#fdf3e3}.stat.warn b{color:#b06a00}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:160px}
.tools button{margin-top:0}
.twrap{overflow-x:auto;border:1px solid #eee;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:#f5f6f8;text-align:left;padding:8px 6px;white-space:nowrap;color:#444;border-bottom:1px solid #eee}
td{padding:6px;border-bottom:1px solid #f2f2f2;white-space:nowrap}
td.cut,th.cut{max-width:130px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#f5f9fe}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;margin-right:4px}
.b-red{background:#fbe4e4;color:#a32d2d}.b-gray{background:#eee;color:#666}.b-yellow{background:#fdf3e3;color:#b06a00}
.num{font-family:ui-monospace,Consolas,monospace;color:#555}
.tip{font-size:12px;color:#999;margin:0 0 14px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9}
.mask[hidden]{display:none}
.mbox{background:#fff;padding:20px;border-radius:14px;width:92%;max-width:430px;box-sizing:border-box}
.mbox h3{margin:0 0 4px;font-size:16px;color:#1e5fa8}
.foot{font-size:12px;color:#aaa;text-align:center}
.foot a{color:#1e5fa8;text-decoration:none}
</style>
</head>
<body>
<div class="head"><h1 class="page-title">号池管理 · 定制版</h1><p class="page-sub">dingzhi ｜ <span class="num">dingzhi.listenmusic888.workers.dev</span> ｜ 可视化管理</p></div>

<div class="abox" id="mainBox">
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" placeholder="搜索：账号 / UID / 邮箱">
    <button class="mini" id="btnCsv">导出 CSV</button>
    <button class="mini" id="btnCopy">复制未绑邮箱名单</button>
    <button class="mini" id="btnRefresh">刷新</button>
  </div>
  <div class="twrap">
    <table>
      <thead><tr><th>#</th><th>账号</th><th>UID</th><th>手机号</th><th>绑定歌曲ID</th><th>入池日期</th><th>有效期</th><th>通知邮箱</th><th>标记</th><th>操作</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <p class="tip" style="margin-top:12px">定制版数据实时来自 dingzhi worker（独立号池 POOL-DZ），本页面支持查看 / 编辑（邮箱、CK、歌曲、有效期）/ 删除 / 暂停互听，修改立即生效并同步到每日任务。删除与修改请谨慎操作。</p>
</div>

<div class="mask" id="mask" hidden>
  <div class="mbox">
    <h3 id="mTitle">编辑账号</h3>
    <label>有效期（填天数如 30 / 日期 2026-12-31 / 永久；留空=不改）</label><input id="mExp">
    <label>通知邮箱（留空=不改）</label><input id="mEmail">
    <label>新 MUSIC_U / CK（留空=不改）</label><input id="mCk">
    <label>新歌曲分享链接（单曲链接，留空=不改）</label><input id="mLink">
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="mini" id="mSave" style="flex:1;margin:0">保存修改</button>
      <button class="mini gray" id="mCancel" style="flex:1;margin:0">取消</button>
    </div>
    <div class="msg" id="mMsg"></div>
  </div>
</div>

<p class="foot">本项目独立管理 ｜ 管理一群号池请打开 <a href="号池管理_一群.html">号池管理_一群.html</a></p>

<script>
var $=function(id){return document.getElementById(id);};
var BASE='https://dingzhi.listenmusic888.workers.dev';
var PASS='admin123456'; // 定制版管理密码（仅本机使用，勿上传仓库）
var POOL=[],STATS={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function fetchPool(base,pass){
  return fetch(base+'/api/pool',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:pass})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});});
}
function renderStats(){
  var items=[
    ['号池人数',STATS.total,'/ 上限 '+(STATS.limit!=null?STATS.limit:'-')],
    ['剩余名额',STATS.remain,''],
    ['已绑邮箱',STATS.withMail,''],
    ['未绑邮箱',STATS.noMail,''],
    ['标记异常',STATS.noListen,''],
    ['备用登记',STATS.manual,''],
    ['未填歌曲',STATS.public,''],
    ['即将到期',STATS.expiring||0,''],
  ];
  $('stats').innerHTML=items.map(function(it){
    var w=(it[0]==='未绑邮箱'&&it[1]>0)||it[0]==='标记异常'||(it[0]==='即将到期'&&it[1]>0);
    return '<div class="stat'+(w?' warn':'')+'"><b>'+esc(it[1])+'</b><span>'+esc(it[0])+(it[2]?' '+esc(it[2]):'')+'</span></div>';
  }).join('');
}
var RROWS=[];
function daysLeft(e){if(!e.exp||e.exp==='forever')return null;var t=new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);return Math.round((new Date(e.exp+'T00:00:00Z')-new Date(t+'T00:00:00Z'))/86400000);}
function expBadge(e){var d=daysLeft(e);if(d===null)return '<span class="badge b-gray">永久</span>';if(d<0)return '<span class="badge b-red">已过期</span>';if(d<=3)return '<span class="badge b-red">剩'+d+'天</span>';if(d<=7)return '<span class="badge b-yellow">剩'+d+'天</span>';return '<span class="badge b-gray">剩'+d+'天</span>';}
function render(){
  var q=$('q').value.trim().toLowerCase();
  RROWS=POOL.filter(function(e){return !q||(e.name+' '+e.uid+' '+e.email).toLowerCase().indexOf(q)>=0;});
  $('tb').innerHTML=RROWS.map(function(e,i){
    var badge=e.noListen?'<span class="badge b-red">暂停互听</span>':'';
    if(!e.song)badge+='<span class="badge b-yellow">未填歌曲</span>';
    if(String(e.name).indexOf('manual:')===0)badge+='<span class="badge b-gray">备用</span>';
    return '<tr><td>'+(i+1)+'</td><td class="cut" title="'+esc(e.name)+'">'+esc(e.name)+'</td><td class="num">'+esc(e.uid)+'</td><td>'+esc(e.phone||'-')+'</td><td class="num cut" title="'+esc(e.song||'')+'">'+esc(e.song||'-')+'</td><td>'+esc(e.added)+'</td><td>'+expBadge(e)+'</td><td class="cut" title="'+esc(e.email||'')+'">'+esc(e.email||'未绑定')+'</td><td>'+badge+'</td>'
      +'<td><button class="mini" onclick="openEdit('+i+')">编辑</button> <button class="mini gray" onclick="delRow('+i+')">删除</button> <button class="mini gray" onclick="toggleRow('+i+')">'+(e.noListen?'恢复互听':'暂停互听')+'</button></td></tr>';
  }).join('')||'<tr><td colspan="10" style="color:#999">没有匹配的记录</td></tr>';
}
function apiAdmin(payload,msgEl,btn,after){
  payload.pass=PASS;
  if(btn)btn.disabled=true;
  fetch(BASE+'/api/admin/entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(o){
      if(btn)btn.disabled=false;
      if(msgEl){msgEl.textContent=o.d.message||'';msgEl.className='msg '+(o.ok?'ok':'err');}
      if(o.ok&&after)after();
    })
    .catch(function(){if(btn)btn.disabled=false;if(msgEl){msgEl.textContent='网络错误：必要时开代理后重试';msgEl.className='msg err';}});
}
var EDIT=null;
function openEdit(i){
  EDIT=RROWS[i];if(!EDIT)return;
  $('mTitle').textContent='编辑账号 '+(EDIT.name||EDIT.uid);
  var perm=!EDIT.exp||EDIT.exp==='forever';
  $('mExp').value=perm?'':EDIT.exp;
  $('mExp').placeholder='当前：'+(perm?'永久':EDIT.exp+'（剩'+daysLeft(EDIT)+'天）');
  $('mEmail').value='';
  $('mEmail').placeholder='当前：'+(EDIT.email||'未绑定');
  $('mCk').value='';
  $('mLink').value='';
  $('mMsg').textContent='';$('mMsg').className='msg';
  $('mask').hidden=false;
}
function closeEdit(){$('mask').hidden=true;EDIT=null;}
function saveEdit(){
  if(!EDIT)return;
  var p={action:'update',uid:EDIT.uid,name:EDIT.name};
  if($('mExp').value.trim())p.exp=$('mExp').value.trim();
  if($('mEmail').value.trim())p.email=$('mEmail').value.trim();
  if($('mCk').value.trim())p.ck=$('mCk').value.trim();
  if($('mLink').value.trim())p.link=$('mLink').value.trim();
  apiAdmin(p,$('mMsg'),$('mSave'),function(){closeEdit();load();});
}
function delRow(i){
  var e=RROWS[i];if(!e)return;
  var label=e.name||e.uid;
  if(!confirm('【第 1 次确认】确定删除账号 '+label+' 吗？\n会立即从号池和每日任务中移除，不可恢复！'))return;
  var inp=prompt('【第 2 次确认】此操作不可恢复！\n请输入账号名 '+label+' 以确认删除：');
  if(inp===null)return;
  if(inp.trim()!==label){alert('输入不一致，已取消删除。');return;}
  apiAdmin({action:'delete',uid:e.uid,name:e.name},null,null,function(){load();});
}
function toggleRow(i){
  var e=RROWS[i];if(!e)return;
  apiAdmin({action:'update',uid:e.uid,name:e.name,noListen:!e.noListen},null,null,function(){load();});
}
function afterLoad(o){
  POOL=o.d.entries||[];STATS=o.d.stats||{};
  renderStats();render();
}
function load(){
  fetchPool(BASE,PASS).then(function(o){
    if(!o.ok){alert('管理密码错误，请检查页面里的 PASS');return;}
    afterLoad(o);
  }).catch(function(){alert('网络错误：请确认电脑能访问 workers.dev（必要时开代理）');});
}
$('q').oninput=render;
$('btnRefresh').onclick=load;
$('mSave').onclick=saveEdit;
$('mCancel').onclick=closeEdit;
$('mask').onclick=function(ev){if(ev.target===$('mask'))closeEdit();};
$('btnCsv').onclick=function(){
  var rows=[['序号','账号','UID','手机号','歌曲ID','入池日期','有效期','邮箱','标记']];
  POOL.forEach(function(e,i){rows.push([i+1,e.name,e.uid,e.phone||'',e.song||'',e.added||'',(!e.exp||e.exp==='forever')?'永久':e.exp,e.email||'',e.noListen?'暂停互听':'']);});
  var csv='\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='号池_定制版_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
};
$('btnCopy').onclick=function(){
  var noMail=POOL.filter(function(e){return !e.email;});
  if(!noMail.length){alert('全部已绑定邮箱');return;}
  var txt='请以下成员到登记页绑定通知邮箱（账号异常时邮件通知本人）：\n'+noMail.map(function(e){return e.name;}).join('\n');
  function done(){$('btnCopy').textContent='已复制 '+noMail.length+' 条';setTimeout(function(){$('btnCopy').textContent='复制未绑邮箱名单';},2500);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback();});}else{fallback();}
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('复制失败，请手动复制');}document.body.removeChild(ta);}
};
// 打开页面即自动加载
load();
</script>
</body>
</html>
